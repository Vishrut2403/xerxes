[workspace]
members = [
    "cli",
    "xerxes-core"
]
resolver = "2"

[workspace.dependencies]
xerxes-core = { path = "xerxes-core", version = "0.2.9" }
redb = "2.1"
jwalk = "0.8"
nucleo-matcher = "0.3"
notify = "6.1"
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
interprocess = "2.2"
bincode = "1.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
which = "6.0"
